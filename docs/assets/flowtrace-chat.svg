<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <clipPath id="leftClip"><rect x="0" y="34" width="602" height="726"/></clipPath>
    <clipPath id="rightClip"><rect x="628" y="34" width="628" height="726"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#1e1e2e"/>
  <rect x="0" y="0" width="610" height="100%" fill="#181825"/>
  <rect x="610" y="0" width="2" height="100%" fill="#313244"/>
  <rect x="0" y="0" width="100%" height="34" fill="#11111b"/>
  <text x="18" y="23" fill="#a6adc8" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">FlowTrace tree</text>
  <text x="636" y="23" fill="#a6adc8" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">packages/cli/cmd/flowtrace/main.go</text>

  <g clip-path="url(#leftClip)" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">
    <text x="24" y="62" fill="#cba6f7">Flow: Simple query flow</text>
    <text x="24" y="84" fill="#6c7086">Press &lt;CR&gt; jump • a ask • A ask flow • C clear chat • f/F flows • o toggle • q close</text>
    <text x="24" y="128" fill="#f5c2e7">└─ ▾</text><text x="68" y="128" fill="#a6e3a1">packages/cli/cmd/flowtrace/main.go:6</text>
    <text x="68" y="150" fill="#cdd6f4">main builds a query</text>
    <text x="68" y="172" fill="#89b4fa">type: entrypoint</text>
    <text x="46" y="216" fill="#f5c2e7">└─ ▾</text><text x="90" y="216" fill="#a6e3a1">packages/cli/cmd/flowtrace/main.go:10</text>
    <text x="90" y="238" fill="#cdd6f4">runQuery coordinates cache, execution, and formatting</text>
    <text x="90" y="260" fill="#89b4fa">type: service</text>
    <text x="68" y="304" fill="#f5c2e7">├─</text><text x="96" y="304" fill="#a6e3a1">packages/cli/cmd/flowtrace/main.go:21</text>
    <text x="90" y="326" fill="#f5c2e7">│</text><text x="118" y="326" fill="#cdd6f4">executeSQL returns rows</text>
    <text x="68" y="370" fill="#f5c2e7">├─</text><text x="96" y="370" fill="#a6e3a1">packages/cli/cmd/flowtrace/main.go:25</text>
    <text x="90" y="392" fill="#f5c2e7">│</text><text x="118" y="392" fill="#cdd6f4">formatRows creates display value</text>
    <text x="68" y="436" fill="#f5c2e7">└─</text><text x="96" y="436" fill="#fab387">↳ cache hit:</text><text x="202" y="436" fill="#a6e3a1">packages/cli/cmd/flowtrace/main.go:11</text>
    <text x="118" y="458" fill="#cdd6f4">return cached result</text>
  </g>

  <g clip-path="url(#rightClip)">
    <rect x="628" y="88" width="628" height="32" fill="#313244" opacity="0.55"/>
    <text x="638" y="76" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14">  8  }</text>
    <text x="638" y="104" fill="#f38ba8" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14"> 10  func runQuery(query string) string {</text>
    <text x="638" y="132" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14"> 11    if cached := lookupCache(query); cached != &quot;&quot; {</text>
    <text x="638" y="160" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14"> 12      return cached</text>
    <text x="638" y="188" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14"> 13    }</text>
    <text x="638" y="216" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14"> 14    rows := executeSQL(query)</text>
    <text x="638" y="244" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14"> 15    return formatRows(rows)</text>
    <text x="638" y="272" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14"> 16  }</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="216" y="106" width="896" height="520" rx="12" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
    <rect x="216" y="106" width="896" height="38" rx="12" fill="#11111b"/>
    <text x="584" y="131" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14">FlowTrace Chat</text>

    <text x="246" y="174" fill="#cba6f7" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="700"># FlowTrace Chat</text>
    <text x="246" y="204" fill="#6c7086" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">Scope: current-node • type on the `&gt; ` line and press &lt;CR&gt; to send • q closes</text>

    <text x="246" y="254" fill="#89b4fa" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">## You</text>
    <text x="246" y="286" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15">Why is this branch important?</text>

    <text x="246" y="344" fill="#a6e3a1" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">## FlowTrace Agent</text>
    <text x="246" y="378" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15">The cache-hit branch is the early exit in runQuery. It prevents the SQL execution</text>
    <text x="246" y="402" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15">and formatting steps from running when lookupCache already has an answer.</text>
    <text x="246" y="436" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15">Next, inspect executeSQL to understand the miss path and compare what work the</text>
    <text x="246" y="460" fill="#cdd6f4" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15">cache avoids.</text>

    <line x1="246" y1="500" x2="1082" y2="500" stroke="#313244" stroke-width="1"/>
    <text x="246" y="538" fill="#89b4fa" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">## Ask</text>
    <rect x="246" y="554" width="836" height="42" rx="6" fill="#1e1e2e" stroke="#45475a"/>
    <text x="266" y="581" fill="#f5c2e7" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="16">&gt; How does this step relate to formatting?</text>
  </g>
</svg>
