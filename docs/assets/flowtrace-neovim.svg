<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs><clipPath id="leftClip"><rect x="0" y="34" width="602" height="726"/></clipPath><clipPath id="rightClip"><rect x="628" y="34" width="628" height="726"/></clipPath></defs>
  <rect width="100%" height="100%" fill="#1e1e2e"/>
  <rect x="0" y="0" width="610" height="100%" fill="#181825"/>
  <rect x="610" y="0" width="2" height="100%" fill="#313244"/>
  <rect x="0" y="0" width="100%" height="34" fill="#11111b"/>
  <text x="18" y="23" fill="#a6adc8" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">FlowTrace tree</text>
  <text x="636" y="23" fill="#a6adc8" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">examples/simple-go-app/main.go</text>

  <g clip-path="url(#leftClip)" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">
    <text x="24" y="62" fill="#cba6f7">Flow: Simple query flow</text>
    <text x="24" y="84" fill="#6c7086">Press &lt;CR&gt; jump • a ask • A ask flow • C clear chat • f/F flows • o toggle • q close</text>

    <text x="24" y="128" fill="#f5c2e7">└─ ▾</text><text x="68" y="128" fill="#a6e3a1">examples/simple-go-app/main.go:6</text>
    <text x="68" y="150" fill="#cdd6f4">main builds a query</text>
    <text x="68" y="172" fill="#89b4fa">type: entrypoint</text>
    <text x="68" y="194" fill="#9399b2">The program creates a query string and passes it into runQuery.</text>

    <text x="46" y="238" fill="#f5c2e7">└─ ▾</text><text x="90" y="238" fill="#a6e3a1">examples/simple-go-app/main.go:10</text>
    <text x="90" y="260" fill="#cdd6f4">runQuery coordinates cache, execution, and formatting</text>
    <text x="90" y="282" fill="#89b4fa">type: service</text>
    <text x="90" y="304" fill="#9399b2">runQuery checks cache first, executes SQL on miss, then formats rows.</text>

    <text x="68" y="348" fill="#f5c2e7">├─</text><text x="96" y="348" fill="#a6e3a1">examples/simple-go-app/main.go:21</text>
    <text x="90" y="370" fill="#f5c2e7">│</text><text x="118" y="370" fill="#cdd6f4">executeSQL returns rows</text>
    <text x="90" y="392" fill="#f5c2e7">│</text><text x="118" y="392" fill="#89b4fa">type: step</text>
    <text x="90" y="414" fill="#f5c2e7">│</text><text x="118" y="414" fill="#9399b2">The query is executed and rows are returned.</text>

    <text x="68" y="458" fill="#f5c2e7">├─</text><text x="96" y="458" fill="#a6e3a1">examples/simple-go-app/main.go:25</text>
    <text x="90" y="480" fill="#f5c2e7">│</text><text x="118" y="480" fill="#cdd6f4">formatRows creates display value</text>
    <text x="90" y="502" fill="#f5c2e7">│</text><text x="118" y="502" fill="#89b4fa">type: sink</text>
    <text x="90" y="524" fill="#f5c2e7">│</text><text x="118" y="524" fill="#9399b2">Rows are formatted for output.</text>

    <text x="68" y="568" fill="#f5c2e7">└─</text><text x="96" y="568" fill="#fab387">↳ cache hit:</text><text x="202" y="568" fill="#a6e3a1">examples/simple-go-app/main.go:11</text>
    <text x="118" y="590" fill="#cdd6f4">return cached result</text>
    <text x="118" y="612" fill="#89b4fa">type: branch</text>
    <text x="118" y="634" fill="#9399b2">If lookupCache returns a value, runQuery exits early.</text>
  </g>

  <g clip-path="url(#rightClip)" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="14">
    <rect x="628" y="88" width="628" height="32" fill="#313244" opacity="0.55"/>
    <text x="638" y="76" fill="#cdd6f4">  8  }</text>
    <text x="638" y="104" fill="#f38ba8"> 10  func runQuery(query string) string {</text>
    <text x="638" y="132" fill="#cdd6f4"> 11    if cached := lookupCache(query); cached != &quot;&quot; {</text>
    <text x="638" y="160" fill="#cdd6f4"> 12      return cached</text>
    <text x="638" y="188" fill="#cdd6f4"> 13    }</text>
    <text x="638" y="216" fill="#cdd6f4"> 14    rows := executeSQL(query)</text>
    <text x="638" y="244" fill="#cdd6f4"> 15    return formatRows(rows)</text>
    <text x="638" y="272" fill="#cdd6f4"> 16  }</text>
  </g>
</svg>
